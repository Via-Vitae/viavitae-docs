name: CodeQL

# CodeQL static analysis for JavaScript/TypeScript — the language of the Hugo
# theme customisations and site scripts in viavitae-docs.
#
# LEAST-PRIVILEGE TOKEN
#   Only the `analyze` job escalates to `security-events: write` for SARIF upload
#   and `actions: read`. No other scope is granted.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "codeql-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: false

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Detect present languages
        id: detect
        run: |
          set -euo pipefail
          langs=()
          if find . -type f \( -name '*.py' -o -name '*.pyi' \) \
             -not -path './.venv/*' -not -path './.github/*' -print -quit | grep -q .; then
            langs+=("python")
            echo "Python files found"
          else
            echo "No Python files"
          fi
          if find . -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) \
             -not -path './node_modules/*' -not -path './.github/*' -print -quit | grep -q .; then
            langs+=("javascript-typescript")
            echo "JavaScript/TypeScript files found"
          else
            echo "No JavaScript/TypeScript files"
          fi
          if [ ${#langs[@]} -eq 0 ]; then
            echo "No scannable source files — CodeQL will complete with a no-op."
            langs=("none")
          fi
          printf 'languages=%s\n' "$(jq -cn --args '$ARGS.positional' "${langs[@]}")" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect
    if: needs.detect.outputs.languages != '["none"]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect.outputs.languages) }}
        build-mode: ["none"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
          sarif-add-snippets: true
          external-data: false
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b
        with:
          category: "/language:${{ matrix.language }}/build-mode:${{ matrix.build-mode }}"
          upload: always
          output: sarif-results
      - name: Upload SARIF as artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          if-no-files-found: ignore
          retention-days: 30
